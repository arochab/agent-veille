<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Wire - radar du matin</title>
<!--
  DIRECTION « LE CALIBRE » - dark-only, ASSUMÉ (voir manifeste complet dans
  pwa/design-system.css §0 et la maquette de référence da-explorations/direction-a.html).
  Un instrument est calibré pour SA condition de lecture (téléphone, 10h, une
  main) : une variante claire diluerait l'économie du signal jaune et
  doublerait la surface de maintenance pour zéro euro de plus. Donc UNE seule
  meta theme-color, pas de media prefers-color-scheme. -->
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0B0D10" />
<link rel="manifest" href="pwa/manifest.json" />
<link rel="apple-touch-icon" href="pwa/icon-192.png" />
<!-- Zéro CDN, zéro font externe : tout est local, la PWA vit sans réseau. -->
<link rel="stylesheet" href="pwa/design-system.css" />
</head>
<body>
<div class="tw-app" id="app">

  <header class="tw-hdr">
    <div class="tw-hdr__row">
      <div class="tw-brand">
        <img class="tw-logo" src="assets/the-wire-logo.png" alt="" width="20" height="20" />
        <span class="tw-brand__name">The&nbsp;Wire</span>
      </div>
      <span class="tw-hdr__date" id="date"></span>
    </div>
    <div class="tw-ruler" aria-hidden="true"></div>

    <!-- Headline du jour. Squelette pendant le chargement, jamais de spinner. -->
    <div class="tw-skeleton tw-skeleton--headline" id="headline-skeleton" aria-hidden="true"></div>
    <h1 class="tw-headline" id="headline" hidden></h1>

    <ul class="tw-stats" id="stats" hidden></ul>
    <div id="banner-zone"></div>
  </header>

  <div class="tw-ruler" aria-hidden="true"></div>

  <main id="moves" aria-busy="true" aria-label="Moves du jour">
    <div class="tw-moves" aria-hidden="true">
      <div class="tw-skeleton tw-skeleton--move"></div>
      <div class="tw-skeleton tw-skeleton--move"></div>
    </div>
  </main>

  <!-- Tes go - état réel : lecture SEULE de data/go_suivi.json (same-origin,
       comme data/radar.json). Champs recopiés, zéro calcul d'état côté front.
       Masquée si le fichier est absent (donnée privée, GitHub Pages public). -->
  <section class="tw-etat-section" id="etat-reel-section" hidden aria-label="Tes go - état réel">
    <div id="etat-reel-list"></div>
  </section>

  <!-- Aperçus locaux - rien n'est parti : pipeline SIMULÉ (voir pwa/app.js),
       toujours au conditionnel. Rien n'est envoyé au poller réel - miroir
       visuel local du rituel Telegram, persisté en localStorage. Jamais
       fusionné avec la section d'état réel ci-dessus. -->
  <section class="tw-gos" id="gos-section" hidden aria-label="Aperçus locaux - rien n'est parti">
    <div id="gos-list"></div>
  </section>

  <section class="tw-skill" id="skill" hidden>
    <div class="tw-skill__label">🎓 Skill up - cette semaine</div>
    <p id="skill-text"></p>
  </section>

  <div class="tw-ruler" aria-hidden="true"></div>
  <footer class="tw-foot" id="foot"></footer>

  <!-- Annonces pour lecteurs d'écran (copie, chargement, go) -->
  <div class="visually-hidden" role="status" aria-live="polite" id="live"></div>
</div>

<script src="pwa/config.js"></script>
<script src="pwa/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.v1.js").catch(function () {});
}
</script>
</body>
</html>
