<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>The Wire — radar du matin</title>
<!-- Thème sombre par défaut (spec DA §6), variante claire automatique.
     Chaque meta porte son media : sans lui, la première matcherait TOUJOURS
     (premier-qui-matche-gagne) et la variante claire serait morte.
     La dernière, sans media, est le repli des navigateurs qui l'ignorent. -->
<meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#F0EEE6" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#131210" />
<meta name="color-scheme" content="dark light" />
<link rel="manifest" href="pwa/manifest.json" />
<link rel="apple-touch-icon" href="pwa/icon-192.png" />
<!-- Zéro CDN, zéro font externe : tout est local, la PWA vit sans réseau. -->
<link rel="stylesheet" href="pwa/design-system.css" />
</head>
<body>
<div class="tw-app" id="app">

  <header class="tw-hdr">
    <div class="tw-hdr__row">
      <div class="tw-brand">
        <img class="tw-logo" src="assets/the-wire-logo.png" alt="" width="28" height="28" />
        <span class="tw-brand__name">The Wire</span>
      </div>
      <span class="tw-hdr__date" id="date"></span>
    </div>

    <!-- Headline du jour (serif). Squelette pendant le chargement, jamais de spinner. -->
    <div class="tw-skeleton tw-skeleton--headline" id="headline-skeleton" aria-hidden="true"></div>
    <h1 class="tw-headline" id="headline" hidden></h1>

    <div class="tw-stats" id="stats" hidden></div>
    <div id="banner-zone"></div>
  </header>

  <main id="moves" aria-busy="true" aria-label="Moves du jour">
    <div class="tw-moves" aria-hidden="true">
      <div class="tw-skeleton tw-skeleton--move"></div>
      <div class="tw-skeleton tw-skeleton--move"></div>
    </div>
  </main>

  <section class="tw-skill" id="skill" hidden>
    <div class="tw-skill__label">Skill up de la semaine</div>
    <p id="skill-text"></p>
  </section>

  <footer class="tw-foot" id="foot"></footer>

  <!-- Annonces pour lecteurs d'écran (copie, chargement) -->
  <div class="visually-hidden" role="status" aria-live="polite" id="live"></div>
</div>

<script src="pwa/config.js"></script>
<script src="pwa/app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.v1.js").catch(function () {});
}
</script>
</body>
</html>
